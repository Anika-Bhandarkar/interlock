[project]
name = "interlock"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    # PyTorch stopped publishing Intel Mac builds after 2.2.2, which only works with NumPy 1.x.
    # Intel Macs get those older versions; every other platform gets current ones.
    "numpy>=2.4.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "interlock"
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
